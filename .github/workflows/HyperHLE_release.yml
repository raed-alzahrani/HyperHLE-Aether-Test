name: HyperHLE iOS Nightly

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    branches: ["trunk"]
  pull_request:
    branches: ["trunk"]

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout touchHLE
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          fetch-tags: true

      - name: Select the newest installed Xcode
        run: |
          set -eu
          xcode=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -n 1 || true)
          if [ -n "$xcode" ]; then
            sudo xcode-select -s "$xcode/Contents/Developer"
          fi
          echo "DEVELOPER_DIR=$(xcode-select -p)" >> "$GITHUB_ENV"
          xcodebuild -version

      - name: Install build tools
        run: brew install ninja ldid

      - name: Install AArch64 iOS Rust toolchain
        run: rustup target add aarch64-apple-ios

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Download Boost
        run: |
          set -eu
          mkdir -p vendor
          curl -L -O "https://archives.boost.io/release/1.81.0/source/boost_1_81_0.tar.gz"
          tar xzf boost_1_81_0.tar.gz -C vendor
          mv vendor/boost_1_81_0 vendor/boost

      - name: Setup CMake
        uses: lukka/get-cmake@v3
        with:
          cmakeVersion: "~3.29.0"

      - name: Build shared SDL2 for iOS
        run: sh platform/ios/scripts/build-sdl-shared.sh iphoneos

      - name: Build the iOS app
        run: sh platform/ios/scripts/build-host.sh iphoneos Release

      - name: Package the IPAs
        run: |
          set -eu
          sh platform/ios/scripts/package-ipa.sh
          sh platform/ios/scripts/package-ipa.sh --trollstore
          sh platform/ios/scripts/package-ipa.sh --trollstore-permanent-jit

      - name: Verify the IPAs
        run: |
          set -eu
          sh platform/ios/scripts/verify-ipa.sh dist/HyperHLE-iOS-unsigned.ipa
          sh platform/ios/scripts/verify-ipa.sh --trollstore dist/HyperHLE-iOS-trollstore.ipa
          sh platform/ios/scripts/verify-ipa.sh --trollstore-permanent-jit dist/HyperHLE-iOS-trollstore-permanent-jit.ipa

      - name: Publish nightly iOS release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/trunk'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly-latest
          name: HyperHLE Nightly Build
          draft: false
          prerelease: true
          files: dist/HyperHLE-iOS-unsigned.ipa

      - name: Generate source.json for AltStore / SideStore / LiveContainer
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/trunk'
        env:
          SOURCE_URL: https://raw.githubusercontent.com/raed-alzahrani/HyperHLE-Aether-Test/trunk/source.json
          IPA_URL: https://github.com/raed-alzahrani/HyperHLE-Aether-Test/releases/download/nightly-latest/HyperHLE-iOS-unsigned.ipa
        run: |
          set -eu
          IPA_PATH="dist/HyperHLE-iOS-unsigned.ipa"
          SIZE=$(stat -f %z "$IPA_PATH")
          SHA256=$(shasum -a 256 "$IPA_PATH" | awk '{print $1}')
          DATE_ISO=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          BUILD_VERSION="${{ github.run_number }}"
          cat > source.json <<EOF
          {
            "name": "HyperHLE",
            "identifier": "com.klugklug.hyperhle",
            "sourceURL": "${SOURCE_URL}",
            "apps": [
              {
                "name": "HyperHLE",
                "bundleIdentifier": "com.klugklug.hyperhle",
                "developerName": "HyperHLE",
                "version": "nightly-${BUILD_VERSION}",
                "versionDate": "${DATE_ISO}",
                "versionDescription": "Nightly build #${BUILD_VERSION}",
                "downloadURL": "${IPA_URL}",
                "localizedDescription": "HyperHLE nightly build for AltStore / SideStore / LiveContainer.",
                "iconURL": "https://raw.githubusercontent.com/raed-alzahrani/HyperHLE-Aether-Test/trunk/Assets.xcassets/AppIcon.appiconset/icon.png",
                "tintColor": "#5E82FF",
                "size": ${SIZE},
                "minOSVersion": "15.0",
                "metadata": {
                  "sha256": "${SHA256}"
                }
              }
            ]
          }
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add source.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "[skip ci] update source.json for nightly build"
          git push "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" HEAD:trunk

      - name: Upload unsigned IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: HyperHLE-iOS-unsigned
          path: dist/HyperHLE-iOS-unsigned.ipa
          if-no-files-found: error
